name: Validate Plugin

on:
  push:
    branches: [main, v3.0]
  pull_request:
    branches: [main, v3.0]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json
        run: |
          echo "Checking plugin.json..."
          if ! python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"; then
            echo "plugin.json is not valid JSON"
            exit 1
          fi
          echo "plugin.json is valid"

      - name: Validate marketplace.json
        run: |
          echo "Checking marketplace.json..."
          if ! python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"; then
            echo "marketplace.json is not valid JSON"
            exit 1
          fi
          echo "marketplace.json is valid"

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          MISSING=0
          for f in \
            ".claude-plugin/plugin.json" \
            "README.md" \
            "CHANGELOG.md" \
            "LICENSE" \
            "commands/init.md" \
            "skills/methodology/SKILL.md" \
            "skills/validation-strategies/SKILL.md" \
            "skills/change-request/SKILL.md" \
            "skills/agentify/SKILL.md" \
            "skills/skill-bootstrap/SKILL.md" \
            "skills/md-to-pdf/SKILL.md" \
            "skills/md-to-pdf/scripts/convert.py" \
            "skills/md-to-pdf/styles/default.css" \
            "skills/agentify/OPENCODE_HARVEST.md" \
            "skills/agentify/scripts/discover.py" \
            "skills/agentify/templates/agno/tools/guard.py.template" \
            "skills/agentify/templates/agno/tools/verify.py.template" \
            "skills/agentify/templates/agno/tools/gitops.py.template" \
            "skills/agentify/templates/agno/tools/repomap.py.template" \
            "skills/agentify/templates/agno/tools/context.py.template" \
            "skills/agentify/templates/agno/role_coding_agent.py.template" \
            "skills/agentify/templates/agno/role_high_level_ops.py.template" \
            "skills/agentify/templates/agno/role_scout.py.template" \
            "skills/agentify/templates/agno/test_guard.py.template" \
            "skills/agentify/templates/agno/eval_coder.py.template" \
            "skills/agentify/templates/agno/golden_tasks.yaml.template" \
            "skills/agentify/templates/prompts/coding_agent/default.md.template" \
            "skills/agentify/templates/ops/RUNBOOK.md.template" \
            "skills/deep-research/SKILL.md" \
            "skills/deep-research/scripts/deep_research.py" \
            "skills/deep-research/scripts/grounded_research.py" \
            "skills/deep-research/scripts/env_loader.py" \
            "skills/deep-research/prompts/round_esplorazione.md" \
            "skills/deep-research/prompts/round_dubbi.md" \
            "skills/deep-research/prompts/round_shortlist.md" \
            "skills/deep-research/prompts/round_verticale.md" \
            "skills/deep-research/prompts/audit_second_opinion.md" \
            "skills/deep-research/references/interactions_api.md" \
            "skills/deep-research/references/funnel_tuning.md" \
            "skills/deep-research/templates/fullauto/pipeline.py.template" \
            "skills/deep-research/templates/fullauto/WIRING.md" \
            "templates/modulo/CLAUDE.md" \
            "templates/modulo/PROJECT_SPEC.md" \
            "templates/modulo/PLAN.md" \
            "templates/cartella/CLAUDE.md" \
            "templates/cartella/PROJECT_SPEC.md" \
            "templates/skill-stub/SKILL.md" \
            "docs/MIGRATION_2.1_to_3.0.md"
          do
            if [ ! -f "$f" ]; then
              echo "  Missing: $f"
              MISSING=$((MISSING + 1))
            else
              echo "  OK $f"
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "$MISSING required files missing"
            exit 1
          fi
          echo "All required files present"

      - name: Validate skill frontmatter
        run: |
          echo "Checking skill frontmatter..."
          for f in skills/*/SKILL.md; do
            if ! head -1 "$f" | grep -q "^---"; then
              echo "  $f: missing YAML frontmatter"
              exit 1
            fi
            if ! grep -q "^name:" "$f"; then
              echo "  $f: missing 'name' in frontmatter"
              exit 1
            fi
            if ! grep -q "^description:" "$f"; then
              echo "  $f: missing 'description' in frontmatter"
              exit 1
            fi
            echo "  OK $f"
          done
          echo "All skills have valid frontmatter"

      - name: Validate command frontmatter
        run: |
          echo "Checking command frontmatter..."
          for f in commands/*.md; do
            if ! head -1 "$f" | grep -q "^---"; then
              echo "  $f: missing YAML frontmatter"
              exit 1
            fi
            if ! grep -q "^name:" "$f"; then
              echo "  $f: missing 'name' in frontmatter"
              exit 1
            fi
            echo "  OK $f"
          done
          echo "All commands have valid frontmatter"

      - name: Cross-check plugin.json paths
        run: |
          echo "Checking that all paths in plugin.json exist..."
          python3 - <<'EOF'
          import json, sys, os
          with open('.claude-plugin/plugin.json') as f:
              data = json.load(f)
          missing = []
          # commands: array of paths to .md files
          for p in data.get('commands', []):
              rel = p.lstrip('./')
              if not os.path.isfile(rel):
                  missing.append(('command', p))
          # skills: array of paths to directories containing SKILL.md
          skills = data.get('skills')
          if isinstance(skills, str):
              skills = [skills]
          for p in skills or []:
              rel = p.rstrip('/').lstrip('./')
              if not os.path.isdir(rel):
                  missing.append(('skill-dir', p))
              elif not os.path.isfile(os.path.join(rel, 'SKILL.md')):
                  missing.append(('skill-md', p + 'SKILL.md'))
          if missing:
              print("Issues in plugin.json paths:")
              for kind, m in missing:
                  print(f"  [{kind}] {m}")
              sys.exit(1)
          print("All plugin.json paths exist")
          EOF

      - name: Python syntax check (scripts + rendered-as-python templates)
        run: |
          echo "Compiling plugin scripts..."
          python3 -m compileall -q skills/*/scripts/ || exit 1
          echo "All scripts compile"

      - name: Script paths must use CLAUDE_PLUGIN_ROOT
        run: |
          python3 - <<'EOF'
          import re, sys, pathlib
          # Un path relativo tipo `python skills/x/scripts/y.py` funziona solo se
          # la skill e' copiata dentro il progetto. Installata da marketplace la
          # skill vive nella plugin dir: il comando fallisce al primo uso e il
          # modello finisce a improvvisare.
          bad = []
          pat = re.compile(r'python[0-9.]*\s+["\']?(?:\./)?(?:\.claude/)?skills/')
          for f in list(pathlib.Path('skills').rglob('SKILL.md')) + \
                   list(pathlib.Path('commands').glob('*.md')):
              for i, line in enumerate(f.read_text(encoding='utf-8').splitlines(), 1):
                  if 'CLAUDE_PLUGIN_ROOT' in line:
                      continue
                  if pat.search(line):
                      bad.append(f"{f}:{i}: {line.strip()}")
          if bad:
              print("Script paths senza ${CLAUDE_PLUGIN_ROOT}:")
              print("\n".join("  " + b for b in bad))
              sys.exit(1)
          print("All script invocations use CLAUDE_PLUGIN_ROOT")
          EOF

      - name: No prose placeholders inside role prompts
        run: |
          python3 - <<'EOF'
          import sys, pathlib
          # Un "TODO durante scaffolding" dentro la stringa delle instructions
          # diventa la definizione di scope che il modello legge — e non e' un
          # {{ }}, quindi il grep documentato in A6 non lo intercetta. Nei
          # template che finiscono nel system prompt deve essere un placeholder.
          prompt_facing = [
              "skills/agentify/templates/agno/role.py.template",
              "skills/agentify/templates/agno/role_coding_agent.py.template",
              "skills/agentify/templates/agno/role_high_level_ops.py.template",
              "skills/agentify/templates/agno/orchestrator.py.template",
          ]
          bad = []
          for p in prompt_facing:
              f = pathlib.Path(p)
              if not f.exists():
                  bad.append(f"{p}: mancante")
                  continue
              for i, line in enumerate(f.read_text(encoding='utf-8').splitlines(), 1):
                  s = line.strip()
                  # ammesso solo come commento Python di guida, fuori dalla stringa
                  if "TODO durante scaffolding" in s and not s.startswith("#"):
                      bad.append(f"{p}:{i}: {s}")
          if bad:
              print("Segnaposto in prosa dentro un prompt (usa un {{ placeholder }}):")
              print("\n".join("  " + b for b in bad))
              sys.exit(1)
          print("Role prompts use real placeholders")
          EOF

      - name: Skill descriptions within budget
        run: |
          python3 - <<'EOF'
          import re, sys, pathlib
          # Le description stanno SEMPRE in contesto: sono budget, non spazio libero.
          LIMIT = 600
          bad, total = [], 0
          for f in sorted(pathlib.Path('skills').glob('*/SKILL.md')):
              m = re.search(r'(?m)^description:\s*(.*)$', f.read_text(encoding='utf-8'))
              n = len(m.group(1)) if m else 0
              total += n
              print(f"  {f.parent.name:<24} {n:>4} chars")
              if n > LIMIT:
                  bad.append(f"{f.parent.name}: {n} > {LIMIT}")
          print(f"  {'TOTALE':<24} {total:>4} chars sempre in contesto")
          if bad:
              print("Description oltre budget:")
              print("\n".join("  " + b for b in bad))
              sys.exit(1)
          EOF

      - name: Summary
        run: |
          echo ""
          echo "==========================================="
          echo "  Vibecoding Plugin Validation Passed"
          echo "==========================================="
          echo ""
          echo "  Commands: $(ls commands/*.md | wc -l)"
          echo "  Skills:   $(ls skills/*/SKILL.md | wc -l)"
          echo "  Templates:$(find templates -type f | wc -l)"
